name: Analyze site and run tests

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "분석할 사이트 URL (https://...)"
        required: true
        type: string
      max_pages:
        description: "최대 크롤 페이지 수 (1–100)"
        required: false
        default: "20"
        type: string
      max_depth:
        description: "시작 URL 기준 링크 깊이 (0–10)"
        required: false
        default: "2"
        type: string
      trace_mode:
        description: "Playwright trace: failure(실패만 저장) | all(전체) | off"
        required: false
        default: "failure"
        type: choice
        options:
          - failure
          - all
          - off

permissions:
  contents: write

concurrency:
  group: gh-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Install npm dependencies
        working-directory: packages/core
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: packages/core
        run: npx playwright install --with-deps chromium

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        working-directory: packages/core
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          MAX_DEPTH: ${{ github.event.inputs.max_depth }}
          TRACE_MODE: ${{ github.event.inputs.trace_mode }}
          JOB_ID: ${{ github.run_id }}
          DISPATCH_HMAC_SECRET: ${{ secrets.DISPATCH_HMAC_SECRET }}
        run: node src/pipeline.mjs

      - name: Publish job artifacts to gh-pages
        if: always()
        env:
          JOB_ID: ${{ github.run_id }}
        run: bash scripts/publish-job-to-gh-pages.sh

      - name: Pipeline summary
        if: always()
        run: |
          echo "## Job ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "결과 경로 (Pages 배포 후, 한국시간 기준 날짜/시간 폴더): \`jobs/*/*_${{ github.run_id }}/report.html\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "대상 URL: ${{ github.event.inputs.target_url }}" >> "$GITHUB_STEP_SUMMARY"
