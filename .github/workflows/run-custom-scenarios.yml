name: Run custom scenarios (re-test)

on:
  repository_dispatch:
    types: [run-custom-scenarios]
  workflow_dispatch:
    inputs:
      job_id:
        description: "기존 크롤 Job ID (jobs/<id>/structure.json 사용)"
        required: true
        type: string
      scenarios_json:
        description: "전체 scenarios 문서 JSON (scenarios.draft.json 과 동일 형태, 길이 제한 시 Worker 사용)"
        required: true
        type: string
      trace_mode:
        description: "Playwright trace"
        required: false
        default: "failure"
        type: choice
        options:
          - failure
          - all
          - off

permissions:
  contents: write

concurrency:
  group: gh-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  retest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (scripts)
        uses: actions/checkout@v4

      - name: Checkout gh-pages (기존 job 산출물)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare scenarios.final.json 및 JOB_ID
        id: prep
        uses: actions/github-script@v7
        env:
          WD_JOB_ID: ${{ github.event.inputs.job_id }}
          WD_JSON: ${{ github.event.inputs.scenarios_json }}
        with:
          script: |
            const fs = require('fs');
            const ev = context.eventName;
            let jobId;
            let scenariosStr;
            if (ev === 'repository_dispatch') {
              const cp = github.event.client_payload;
              if (!cp || !cp.job_id) core.setFailed('client_payload.job_id required');
              if (!cp.scenarios) core.setFailed('client_payload.scenarios required');
              jobId = String(cp.job_id).trim();
              scenariosStr = JSON.stringify(cp.scenarios);
            } else {
              jobId = String(process.env.WD_JOB_ID || '').trim();
              scenariosStr = process.env.WD_JSON || '';
              if (!jobId) core.setFailed('job_id required');
              if (!scenariosStr) core.setFailed('scenarios_json required');
            }
            try {
              JSON.parse(scenariosStr);
            } catch (e) {
              core.setFailed(`Invalid JSON: ${e}`);
            }
            fs.mkdirSync('packages/core/input', { recursive: true });
            fs.writeFileSync('packages/core/input/scenarios.final.json', scenariosStr);
            core.setOutput('job_id', jobId);

      - name: 기존 structure / 초안 복사
        run: |
          set -euo pipefail
          JOB_ID="${{ steps.prep.outputs.job_id }}"
          mkdir -p packages/core/input
          cp "gh-pages/jobs/${JOB_ID}/structure.json" packages/core/input/structure.json
          if [ -f "gh-pages/jobs/${JOB_ID}/scenarios.draft.json" ]; then
            cp "gh-pages/jobs/${JOB_ID}/scenarios.draft.json" packages/core/input/scenarios.draft.json
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Install & Playwright
        working-directory: packages/core
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tests only
        id: tests
        continue-on-error: true
        working-directory: packages/core
        env:
          JOB_ID: ${{ steps.prep.outputs.job_id }}
          TRACE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.trace_mode || 'failure' }}
        run: npm run run-tests-only

      - name: Publish updated job folder
        if: always()
        env:
          JOB_ID: ${{ steps.prep.outputs.job_id }}
        run: bash scripts/publish-job-to-gh-pages.sh

      - name: Summary
        if: always()
        run: |
          echo "## Re-test job ${{ steps.prep.outputs.job_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "갱신된 리포트: \`jobs/${{ steps.prep.outputs.job_id }}/report.html\`" >> "$GITHUB_STEP_SUMMARY"
