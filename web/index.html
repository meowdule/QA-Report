<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Site Analyzer &amp; Scenario Tester</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Phase 0 · GitHub Pages</p>
        <h1>Site Analyzer &amp; Scenario Tester</h1>
        <p class="lede">
          이 페이지는 저장소의 정적 배포 뼈대입니다. Phase 1부터 URL 분석·크롤·시나리오가
          Actions에서 실행되고, 결과는 <code>jobs/&lt;jobId&gt;/</code> 경로에 게시됩니다.
        </p>
      </header>

      <section class="panel" aria-labelledby="status-heading">
        <h2 id="status-heading">배포 상태</h2>
        <p id="status-line" class="status">클라이언트 로드 완료.</p>
        <p class="hint">
          프로젝트 사이트인 경우 기본 URL은
          <code>https://&lt;user&gt;.github.io/&lt;repo&gt;/</code> 형태입니다.
        </p>
      </section>

      <footer class="footer">
        GitHub 저장소의 README에서 Phase별 진행 상황과 Pages 설정 방법을 확인하세요.
      </footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
